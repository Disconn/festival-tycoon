<!doctype html><html lang="de"><meta charset="utf-8"><title>Spielplan Test</title><style>body{background:#182f29;font:14px sans-serif}.festival-management{position:relative!important;top:0!important;max-height:none!important;width:1200px!important}#result{color:white;padding:10px}</style><div id="result">Testszene – verändert keinen Spielstand</div><section class="festival-management"><div id="planner"></div><div id="mix"></div></section><script type="module">
import './src/festival.css';import {GameState} from './src/game/GameState';import {mountMusicPlanner,musicOverview} from './src/musicPlanner';
const game=new GameState(),s=game.snapshot;s.money=50000;s.dayPlan.leadDays=1;s.dayPlan.festivalDays=2;s.dayPlan.offers.stages=Array(24).fill(true);s.festival.startDay=s.day;
s.buildings.push({...s.buildings[0],kind:'stage',id:'qa-stage-a',x:0,z:0},{...s.buildings[0],kind:'stage',id:'qa-stage-b',x:3,z:0});
const planner=mountMusicPlanner(document.querySelector('#planner'),()=>game.snapshot,action=>{const r=game.manageFestival(action);document.querySelector('#result').textContent=r.message+' · Buchungen '+s.festival.bookings.length+' · Budget '+s.money;planner.render(s);document.querySelector('#mix').innerHTML=musicOverview(s)},message=>document.querySelector('#result').textContent=message);planner.render(s);document.querySelector('#mix').innerHTML=musicOverview(s);
</script></html>
