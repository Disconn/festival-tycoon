name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Pack public web artifact
        run: |
          cd dist
          zip -r ../festival-tycoon-web.zip .

      - name: Upload public web artifact
        uses: actions/upload-artifact@v4
        with:
          name: festival-tycoon-web
          path: festival-tycoon-web.zip
          if-no-files-found: error
          retention-days: 90

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make container package public
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/visibility" \
            -f visibility=public

      - name: Publish latest GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          files: festival-tycoon-web.zip
          body: |
            Öffentliche Build-Artefakte dieses Commits.

            **Web-Build:** `festival-tycoon-web.zip` (statische Dateien)

            **Docker-Image** (HTTP auf Port 8080, inkl. Mehrspieler):

            ```bash
            docker pull ghcr.io/${{ github.repository }}:latest
            docker run --rm -p 8080:8080 -v festival-saves:/app/saves ghcr.io/${{ github.repository }}:latest
            ```

            Danach im Browser öffnen: http://localhost:8080
