services:
  festival:
    build: .
    image: ghcr.io/y1zz1y/festival-tycoon:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    volumes:
      - festival-saves:/app/saves
    restart: unless-stopped

volumes:
  festival-saves:
    name: festival-saves
